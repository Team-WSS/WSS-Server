services:
  api:
    image: ${WEBSOSO_APP_IMAGE:?WEBSOSO_APP_IMAGE required}
    container_name: websoso-api-container
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      TZ: Asia/Seoul
      DEV_DB_NAME: websoso_dev
      DEV_DB_PWD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?APPLE_TEAM_ID required}
      DEV_APPLE_KEY_NAME: ${DEV_APPLE_KEY_NAME:?DEV_APPLE_KEY_NAME required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
    volumes:
      - ./config-repo:/app/config-repo:ro
    depends_on:
      - mysql
      - redis
    networks:
      - default
      - edge
    mem_limit: 1g

networks:
  edge:
    name: edge
    external: true
