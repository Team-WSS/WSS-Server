name: CD-develop

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

concurrency:
  group: develop-oci
  cancel-in-progress: false

jobs:
  deploy-ci-develop:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    outputs:
      config_sha: ${{ steps.config-revision.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true
          fetch-depth: 0

      - name: Update development configuration submodule
        id: config-revision
        run: |
          git submodule update --init --recursive --remote config-repo
          echo "sha=$(git -C config-repo rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build with Gradle
        env:
          DEV_DB_NAME: ${{ secrets.DEV_DB_NAME }}
          DEV_DB_PWD: ${{ secrets.DEV_DB_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEV_APPLE_KEY_NAME: ${{ secrets.DEV_APPLE_KEY_NAME }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: ./gradlew clean apiDocs build -x test -Dspring.profiles.active=dev
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}

      - name: Build and push OCI development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.oci
          platforms: linux/arm64
          push: true
          tags: websoso/websoso-image:dev-${{ github.sha }}

  deploy-cd-develop:
    if: github.ref == 'refs/heads/dev'
    needs: deploy-ci-develop
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout deployment template
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      - name: Check out the configuration used by the build
        env:
          CONFIG_SHA: ${{ needs.deploy-ci-develop.outputs.config_sha }}
          DEV_APPLE_KEY_NAME: ${{ secrets.DEV_APPLE_KEY_NAME }}
        run: |
          git -C config-repo fetch origin main
          git -C config-repo checkout --detach "$CONFIG_SHA"
          [[ "$DEV_APPLE_KEY_NAME" =~ ^[A-Za-z0-9_-]+$ ]]
          test -f config-repo/application-common.yml
          test -f config-repo/application-dev.yml
          test -f config-repo/static/fcm/websoso-fcm.json
          test -f "config-repo/static/apple/AuthKey_${DEV_APPLE_KEY_NAME}.p8"

      - name: Check OCI prerequisites
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_DEV_HOST }}
          username: ${{ secrets.OCI_DEV_USER }}
          key: ${{ secrets.OCI_DEV_SSH_KEY }}
          script: |
            set -eu
            cd /home/websoso/websoso
            test -f compose.yaml
            test -f .env
            docker network inspect edge >/dev/null
            test "$(docker inspect --format '{{.State.Running}}' websoso-mysql-container)" = true
            test "$(docker inspect --format '{{.State.Running}}' websoso-redis-container)" = true
            mkdir -p config-repo/static/apple config-repo/static/fcm

      - name: Upload development configuration and app compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.OCI_DEV_HOST }}
          username: ${{ secrets.OCI_DEV_USER }}
          key: ${{ secrets.OCI_DEV_SSH_KEY }}
          source: deploy/oci/compose.app.yaml,config-repo/application-common.yml,config-repo/application-dev.yml,config-repo/static/fcm/websoso-fcm.json,config-repo/static/apple/AuthKey_${{ secrets.DEV_APPLE_KEY_NAME }}.p8
          target: /home/websoso/websoso

      - name: Protect configuration files and place app compose file
        uses: appleboy/ssh-action@v1
        env:
          DEV_APPLE_KEY_NAME: ${{ secrets.DEV_APPLE_KEY_NAME }}
        with:
          host: ${{ secrets.OCI_DEV_HOST }}
          username: ${{ secrets.OCI_DEV_USER }}
          key: ${{ secrets.OCI_DEV_SSH_KEY }}
          envs: DEV_APPLE_KEY_NAME
          script: |
            set -eu
            cd /home/websoso/websoso
            test -f deploy/oci/compose.app.yaml
            test -f config-repo/application-common.yml
            test -f config-repo/application-dev.yml
            test -f config-repo/static/fcm/websoso-fcm.json
            test -f "config-repo/static/apple/AuthKey_${DEV_APPLE_KEY_NAME}.p8"
            chmod 700 config-repo config-repo/static config-repo/static/apple config-repo/static/fcm
            chmod 600 config-repo/application-common.yml config-repo/application-dev.yml config-repo/static/fcm/websoso-fcm.json "config-repo/static/apple/AuthKey_${DEV_APPLE_KEY_NAME}.p8"
            cp deploy/oci/compose.app.yaml compose.app.yaml

      - name: Deploy Websoso app
        uses: appleboy/ssh-action@v1
        env:
          WEBSOSO_APP_IMAGE: websoso/websoso-image:dev-${{ github.sha }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEV_APPLE_KEY_NAME: ${{ secrets.DEV_APPLE_KEY_NAME }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        with:
          host: ${{ secrets.OCI_DEV_HOST }}
          username: ${{ secrets.OCI_DEV_USER }}
          key: ${{ secrets.OCI_DEV_SSH_KEY }}
          envs: WEBSOSO_APP_IMAGE,APPLE_TEAM_ID,DEV_APPLE_KEY_NAME,S3_ACCESS_KEY,S3_SECRET_KEY
          script: |
            set -eu
            cd /home/websoso/websoso
            docker compose -p websoso-dev -f compose.yaml -f compose.app.yaml config --quiet
            docker compose -p websoso-dev -f compose.yaml -f compose.app.yaml pull api
            docker compose -p websoso-dev -f compose.yaml -f compose.app.yaml up -d --no-deps --force-recreate api

      - name: Verify public health endpoint
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 https://dev.websoso.kr/actuator/health
